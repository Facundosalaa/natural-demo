services:
  natural-demo:
    image: nginx:alpine
    container_name: natural-demo
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.natural-demo.rule=Host(`ordenya.zubuagency.com`) && PathPrefix(`/tienda`)
      - traefik.http.routers.natural-demo.entrypoints=web,websecure
      - traefik.http.routers.natural-demo.tls=true
      - traefik.http.routers.natural-demo.tls.certresolver=mytlschallenge
      - traefik.http.routers.natural-demo.priority=100
      - traefik.http.middlewares.natural-strip.stripprefix.prefixes=/tienda
      - traefik.http.routers.natural-demo.middlewares=natural-strip
      - traefik.http.services.natural-demo.loadbalancer.server.port=80

networks:
  proxy:
    external: true
